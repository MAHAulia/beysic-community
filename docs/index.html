<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beysic — Komunitas Beyblade</title>
  <meta name="description" content="Pusat informasi komunitas, pendaftaran event, dan leaderboard pemain Beyblade." />
  <!-- Fonts & icon set (gaya template Axio -> palet cyan, font Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Stylesheet modular (responsive.css HARUS terakhir) -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/events.css" />
  <link rel="stylesheet" href="css/leaderboard.css" />
  <link rel="stylesheet" href="css/membership.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Loader (gaya template, logo cyan) -->
  <div class="loader" id="loader">
    <div class="loader__content">
      <div class="loader__logo"><img class="loader__logo-img loader__spin" src="assets/img/logo.jpg" alt="Beysic" /></div>
      <p class="loader__text">BEYSIC<span class="dots"><span></span><span></span><span></span></span></p>
    </div>
  </div>
  <header class="site-header">
    <div class="brand">
      <img class="brand-logo" src="assets/img/logo.jpg" alt="Logo Beysic" />
      <a href="#/" class="brand-name">Beysic<span class="brand-sub">Blader Community</span></a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false">≡</button>
    <nav class="site-nav" id="siteNav" aria-label="Navigasi utama">
      <a href="#/">Home</a>
      <a href="#/event">Event</a>
      <a href="#/leaderboard">Leaderboard</a>
      <a href="#/membership">Membership</a>
      <a href="#/profile" class="nav-member hidden" data-role="member">Profil</a>
      <a href="#/admin" class="nav-admin hidden" data-role="admin">Admin</a>
    </nav>
    <div class="auth-area" id="authArea">
      <!-- Diisi oleh auth.js: tombol login Google atau info user -->
    </div>
  </header>

  <main id="app" class="app-main" aria-live="polite">
    <!-- Halaman dirender oleh router -->
    <div class="loading">Memuat…</div>
  </main>

  <footer class="site-footer">
    <p class="footer-tagline">Where Every Blader is a Champion!</p>
    <p>Beysic — Komunitas Beyblade · Let's go shoot together!</p>
    <p class="footer-credit">
      Desain memakai aset template
      <a href="https://themewagon.com/themes/axio/" target="_blank" rel="noopener">Axio</a>
      oleh <a href="https://mixdesigntemplates.gumroad.com/" target="_blank" rel="noopener">mix_design</a>,
      didistribusikan oleh <a href="https://themewagon.com/" target="_blank" rel="noopener">ThemeWagon</a>.
    </p>
  </footer>

  <!-- Modul JS (urutan penting: config -> util -> core -> pages -> app) -->
  <script src="config.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/event.js"></script>
  <script src="js/pages/leaderboard.js"></script>
  <script src="js/pages/membership.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</html>
